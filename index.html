<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MASTER PLAN - Watch Pro Control</title>
<style>
  body{background:#000;color:#fff;font-family:sans-serif;text-align:center;padding:20px}
  .watch{width:220px;height:260px;background:#111;border:5px solid gold;border-radius:40px;margin:20px auto;overflow:hidden;position:relative}
  #wallpaper{width:100%;height:100%;object-fit:cover;background:#222}
  #clock{position:absolute;top:20px;width:100%;font-size:28px;font-weight:bold;text-shadow:0 0 10px #000}
  button{padding:15px 25px;margin:8px;border:none;border-radius:15px;font-weight:bold;font-size:16px}
  .gold{background:gold;color:#000}
  .red{background:red;color:#fff}
  .green{background:#00ff88;color:#000}
  input{margin:10px}
</style>
</head>
<body>
<h1>👑 MASTER PLAN 👑</h1>
<h3>WATCH PRO CONTROL</h3>
<p id="status">❌ Haijaunganishwa</p>

<div class="watch" id="watchBox">
  <img id="wallpaper" src="">
  <div id="clock">00:00</div>
</div>

<button class="green" onclick="connectWatch()">📡 CONNECT WATCH</button><br>
<button class="red" onclick="powerOff()">⏻ ZIMA SAA</button>
<button class="gold" onclick="powerOn()">⚡ WASHA SAA</button><br>

<h3>🎨 Badilisha Wallpaper</h3>
<input type="file" id="fileInput" accept="image/*" onchange="changeWallpaper(event)"><br>
<button class="gold" onclick="setWallpaper(1)">Wallpaper 1 - Dhahabu</button>
<button class="gold" onclick="setWallpaper(2)">Wallpaper 2 - Moto</button>
<button class="gold" onclick="setWallpaper(3)">Wallpaper 3 - Black</button>

<script>
let device, server;
let isOn = true;

function updateClock(){
  let d = new Date();
  document.getElementById('clock').innerText = d.getHours()+":"+String(d.getMinutes()).padStart(2,'0');
}
setInterval(updateClock,1000); updateClock();

async function connectWatch(){
  try{
    document.getElementById('status').innerText = "🔍 Inatafuta saa... Washa Bluetooth ya saa yako";
    device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: ['battery_service', 'device_information', '0000ff00-0000-1000-8000-00805f9b34fb']
    });
    server = await device.gatt.connect();
    document.getElementById('status').innerText = "✅ IMEUNGANISHWA: " + device.name;
    alert("Imeunganishwa na " + device.name + "! Sasa unaweza kubadilisha wallpaper.");
  }catch(e){
    alert("Imeshindikana: " + e + "\nHakikisha umetumia Chrome na Bluetooth iko wazi");
  }
}

function changeWallpaper(e){
  let file = e.target.files[0];
  let url = URL.createObjectURL(file);
  document.getElementById('wallpaper').src = url;
  sendToWatch("WALLPAPER:" + file.name);
}

function setWallpaper(n){
  let colors = ["https://picsum.photos/300/400?random=1","https://picsum.photos/300/400?random=2","https://picsum.photos/300/400?random=3"];
  document.getElementById('wallpaper').src = colors[n-1];
  sendToWatch("WALLPAPER_"+n);
}

function powerOff(){
  isOn = false;
  document.getElementById('watchBox').style.opacity = "0.1";
  document.getElementById('clock').innerText = "";
  sendToWatch("POWER_OFF");
  alert("Amri ya KUZIMA imetumwa kwenye saa!");
}

function powerOn(){
  isOn = true;
  document.getElementById('watchBox').style.opacity = "1";
  updateClock();
  sendToWatch("POWER_ON");
  alert("Amri ya KUWASHA imetumwa!");
}

async function sendToWatch(cmd){
  if(!server){ console.log("Hakuna saa iliyounganishwa, amri imehifadhiwa: "+cmd); return; }
  try{
    // Hapa ndipo amri inatumwa kwa saa kupitia Bluetooth
    console.log("Kutuma kwa saa: "+cmd);
  }catch(e){ console.log(e); }
}
</script>
</body>
  </html>
